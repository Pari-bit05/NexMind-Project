{% macro icon(name) -%}
<svg class="icon" aria-hidden="true"><use href="#i-{{ name }}"/></svg>
{%- endmacro %}

{% macro page_head(icon_name, title, description) %}
<header class="page-head">
  <div class="page-mark">{{ icon(icon_name) }}</div>
  <div>
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
  </div>
</header>
{% endmacro %}

{% macro csrf_field() -%}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{%- endmacro %}
